<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>备婚清单 · 王少松 & 夏梦颖</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E15B7E">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="备婚清单">
<style>
  :root {
    /* iOS 风格设计令牌：系统灰背景 + 品牌粉作为 Tint */
    --primary: #E15B7E;
    --primary-dark: #C24365;
    --primary-bg: #FDECF2;
    --accent: #FF9500;
    --accent-bg: #FFF4E5;
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --input-bg: #F2F2F7;
    --text: #1C1C1E;
    --text2: rgba(60, 60, 67, .6);
    --text3: rgba(60, 60, 67, .45);
    --text4: rgba(60, 60, 67, .25);
    --border: rgba(60, 60, 67, .12);
    --divider: rgba(60, 60, 67, .08);
    --error: #FF3B30;
    --success: #34C759;
    --grad: linear-gradient(135deg, #F3839F 0%, #E15B7E 100%);
    --grad-hero: linear-gradient(135deg, #F795AC 0%, #E15B7E 60%, #D34A6F 100%);
    --radius: 14px;
    --radius-lg: 18px;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04);
    --shadow-hero: 0 6px 18px rgba(225, 91, 126, .22);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.5;
    touch-action: manipulation;
  }
  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  button { font-family: inherit; border: none; background: none; cursor: pointer; }
  input { font-family: inherit; outline: none; border: none; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top)) 18px 6px;
  }
  .topbar-title { font-size: 30px; font-weight: 700; letter-spacing: .3px; color: var(--text); }
  .sync {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text3);
    background: rgba(120,120,128,.12);
    padding: 4px 10px; border-radius: 999px;
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .sync-dot.warn { background: var(--accent); }
  .sync-dot.err { background: var(--error); }

  main { flex: 1; padding: 0 16px; }
  .view { display: none; padding-bottom: 110px; }
  .view.active { display: block; animation: viewIn .25s cubic-bezier(0.2, 0, 0, 1); }

  /* ---------- Hero 卡片 ---------- */
  .hero {
    margin-top: 12px;
    padding: 24px;
    border-radius: var(--radius-lg);
    background: var(--grad-hero);
    box-shadow: var(--shadow-hero);
    color: #fff;
  }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hero-names { font-size: 24px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hero-date { font-size: 14px; color: rgba(255,255,255,.88); margin-top: 3px; }
  .countdown-badge {
    flex-shrink: 0; min-width: 74px; text-align: center;
    background: rgba(255,255,255,.18); border-radius: 14px; padding: 8px 12px;
  }
  .countdown-num { font-size: 26px; font-weight: 700; line-height: 1.1; display: block; }
  .countdown-label { font-size: 11px; color: rgba(255,255,255,.9); }
  .hero-divider { height: 1px; background: rgba(255,255,255,.25); margin: 14px 0; }
  .hero-progress-info { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .hero-progress-info span:last-child { color: rgba(255,255,255,.9); }

  .hero-stats { display: flex; align-items: center; justify-content: space-between; }
  .stat-item { flex: 1; text-align: center; min-width: 0; }
  .stat-value { display: block; font-size: 18px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-label { display: block; font-size: 11px; color: rgba(255,255,255,.85); margin-top: 2px; }

  /* ---------- 进度条 ---------- */
  .track { width: 100%; border-radius: 999px; background: var(--divider); overflow: hidden; }
  .track.white { background: rgba(255,255,255,.32); }
  .bar { height: 100%; border-radius: 999px; background: var(--grad); transition: width .3s ease; }
  .track.white .bar { background: #fff; }
  .bar.danger { background: var(--error); }

  /* ---------- 筛选 chips ---------- */
  .chips-scroll { margin-top: 12px; }
  .chips-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px; }
  .chip {
    flex-shrink: 0;
    height: 36px; padding: 0 16px;
    border-radius: 999px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text2); font-size: 13px;
    display: inline-flex; align-items: center;
    transition: all .15s ease;
  }
  .chip:active { transform: scale(.96); }
  .chip.active { background: var(--grad); border-color: transparent; color: #fff; font-weight: 500; }
  .chip.form { background: var(--input-bg); border-color: transparent; }
  .chip.form.active { background: var(--primary-bg); border-color: var(--primary); color: var(--primary); }

  /* ---------- 卡片 ---------- */
  .card {
    margin-top: 16px; padding: 16px;
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .card-title { font-size: 17px; font-weight: 600; }
  .card-tip { font-size: 12px; color: var(--text3); }

  /* ---------- 任务 ---------- */
  .stage-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .stage-title-wrap { display: flex; align-items: center; min-width: 0; }
  .stage-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grad); margin-right: 8px; flex-shrink: 0; }
  .stage-name { font-size: 17px; font-weight: 600; }
  .stage-time { font-size: 11px; color: var(--text3); margin-left: 8px; flex-shrink: 0; }
  .stage-count { font-size: 14px; color: var(--text3); flex-shrink: 0; }
  .zone-head { margin: 18px 4px 2px; font-size: 13px; font-weight: 600; color: var(--text2); }
  .section-head { margin: 20px 4px 4px; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .section-title-wrap { display: flex; align-items: center; gap: 6px; }
  .section-chev { color: #E15B7E; font-size: 14px; line-height: 1; transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .section-chev.open { transform: rotate(-180deg); }
  .section-add { font-size: 12px; font-weight: 600; color: #E15B7E; }
  .section-body { display: none; }
  .section-body.open { display: block; animation: fadeIn .25s ease; }
  .task-list { margin-top: 12px; }
  .task {
    display: flex; align-items: flex-start;
    padding: 12px 0; border-bottom: 1px solid var(--divider);
  }
  .task:last-child { border-bottom: none; padding-bottom: 0; }
  .task:first-child { padding-top: 0; }
  .checkbox {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid rgba(60, 60, 67, .3);
    margin-right: 12px; margin-top: 1px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: transparent; font-size: 13px; font-weight: 700; line-height: 1;
    transition: all .15s ease; cursor: pointer;
  }
  .checkbox:active { transform: scale(.85); }
  .checkbox.done { background: var(--grad); border-color: transparent; color: #fff; }
  .task-content { flex: 1; min-width: 0; cursor: pointer; }
  .task-title-row { display: flex; align-items: center; }
  .task-title { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task.done .task-title { color: var(--text3); }
  .task-desc { display: block; font-size: 13px; color: var(--text3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task.done .task-desc { color: var(--text4); }
  .custom-tag {
    flex-shrink: 0; margin-left: 6px; padding: 1px 7px;
    border-radius: 999px; background: var(--accent-bg); color: var(--accent);
    font-size: 10px; white-space: nowrap;
  }
  .task-del {
    flex-shrink: 0; width: 26px; height: 26px; margin-left: 4px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text4); font-size: 13px; cursor: pointer;
  }
  .task-del:active { opacity: .6; }
  .task-edit {
    flex-shrink: 0; width: 26px; height: 26px; margin-left: 4px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text3); font-size: 13px; cursor: pointer;
  }
  .task-edit:active { opacity: .6; }
  .empty-tip { display: block; text-align: center; font-size: 14px; color: var(--text3); padding: 18px 0; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed; right: calc(50% - 280px + 16px); bottom: calc(76px + env(safe-area-inset-bottom));
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--grad); color: #fff;
    font-size: 28px; font-weight: 400; line-height: 1;
    box-shadow: 0 8px 24px rgba(225, 91, 126, .4);
    display: flex; align-items: center; justify-content: center;
    z-index: 40; transition: all .15s ease; padding-bottom: 3px;
  }
  .fab:active { transform: scale(.92); }
  @media (max-width: 592px) { .fab { right: 16px; } }

  /* ---------- 分类预算 ---------- */
  .cat-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--divider); cursor: pointer; }
  .cat-row:last-child { border-bottom: none; padding-bottom: 0; }
  .cat-row:active { opacity: .85; }
  .cat-icon {
    width: 38px; height: 38px; border-radius: 50%;
    margin-right: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; font-weight: 600;
  }
  .cat-info { flex: 1; min-width: 0; }
  .cat-name-row { display: flex; align-items: center; justify-content: space-between; }
  .cat-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-amounts { font-size: 12px; color: var(--text3); flex-shrink: 0; margin-left: 8px; }
  .cat-amounts b { color: var(--text2); font-weight: 500; }
  .cat-amounts.over b { color: var(--error); font-weight: 600; }
  .over-tag {
    flex-shrink: 0; margin-left: 5px; padding: 1px 7px;
    border-radius: 999px; background: rgba(245,87,108,.1); color: var(--error);
    font-size: 10px;
  }
  .cat-bar { margin-top: 7px; }

  /* ---------- 支出明细 ---------- */
  .exp-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--divider); }
  .exp-row:last-child { border-bottom: none; padding-bottom: 0; }
  .exp-info { flex: 1; min-width: 0; }
  .exp-title-row { display: flex; align-items: center; }
  .exp-title { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp-cat-tag { flex-shrink: 0; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 10px; white-space: nowrap; }
  .exp-date { display: block; font-size: 12px; color: var(--text3); margin-top: 2px; }
  .exp-amount { flex-shrink: 0; margin-left: 8px; font-size: 16px; font-weight: 600; }
  .exp-del {
    flex-shrink: 0; width: 26px; height: 26px; margin-left: 4px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text4); font-size: 13px; cursor: pointer;
  }
  .exp-del:active { opacity: .6; }
  .exp-edit {
    flex-shrink: 0; width: 26px; height: 26px; margin-left: 4px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text3); font-size: 13px; cursor: pointer;
  }
  .exp-edit:active { opacity: .6; }

  /* ---------- 住宿 ---------- */
  .note-item { display: flex; font-size: 15px; color: var(--text2); padding: 5px 0; }
  .note-dot { color: var(--primary); margin-right: 6px; flex-shrink: 0; }
  .info-row { display: flex; align-items: flex-start; padding: 9px 0; }
  .info-label {
    flex-shrink: 0; margin-right: 10px; margin-top: 1px;
    font-size: 12px; color: var(--primary); background: var(--primary-bg);
    padding: 2px 9px; border-radius: 999px; white-space: nowrap;
  }
  .info-text { font-size: 15px; color: var(--text2); line-height: 1.6; min-width: 0; }
  .info-text.link { color: var(--primary); }
  .info-row:active { opacity: .8; }
  .link-tip { color: var(--primary); cursor: pointer; }
  .link-tip:active { opacity: .7; }
  .guest-row { display: flex; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--divider); }
  .guest-row:last-child { border-bottom: none; padding-bottom: 0; }
  .guest-info { flex: 1; min-width: 0; }
  .guest-top { display: flex; align-items: center; }
  .guest-name { font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .guest-room {
    margin-left: 8px; font-size: 10px; padding: 1px 8px;
    border-radius: 999px; background: var(--primary-bg); color: var(--primary);
    flex-shrink: 0; white-space: nowrap;
  }
  .guest-meta { display: block; font-size: 14px; color: var(--text3); margin-top: 3px; }
  .guest-idno { display: block; font-size: 11px; color: var(--text4); margin-top: 2px; letter-spacing: .3px; }
  .f-textarea {
    width: 100%; min-height: 88px; padding: 10px 14px;
    border-radius: 12px; background: var(--input-bg);
    font-size: 14px; color: var(--text);
    resize: vertical; font-family: inherit; border: none; outline: none;
  }
  .f-textarea::placeholder { color: var(--text4); }

  /* ---------- 确认弹窗 ---------- */
  .confirm-text { font-size: 14px; color: var(--text2); line-height: 1.7; }
  .confirm-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .confirm-btns .btn-primary { flex: 1; margin-top: 0; }
  .confirm-btns .btn-ghost { flex: 1 1 calc(33% - 7px); }
  .btn-ghost {
    flex: 1; height: 50px; border-radius: 14px;
    background: rgba(120,120,128,.12); color: var(--text);
    font-size: 15px; display: flex; align-items: center; justify-content: center;
  }
  .btn-ghost:active { opacity: .8; }

  /* ---------- 底部记账按钮 ---------- */
  .bottom-action {
    position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
    padding: 8px 16px; z-index: 30;
    background: linear-gradient(180deg, rgba(251,245,246,0) 0%, var(--bg) 30%);
  }
  .btn-primary {
    width: 100%; height: 50px; border-radius: 14px;
    background: var(--grad); color: #fff;
    font-size: 17px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s ease;
  }
  .btn-primary:active { opacity: .9; transform: scale(.98); }

  /* ---------- 我的页 ---------- */
  .profile-card { text-align: center; padding: 26px 20px; }
  .avatar {
    width: 68px; height: 68px; margin: 0 auto;
    border-radius: 50%;
    background: rgba(255,255,255,.2);
    border: 2px solid rgba(255,255,255,.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 700; color: #fff;
  }
  .profile-hero { background: var(--grad-hero); box-shadow: var(--shadow-hero); color: #fff; border-radius: var(--radius-lg); margin-top: 10px; padding: 26px 20px; text-align: center; }
  .profile-names { display: block; margin-top: 12px; font-size: 21px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .profile-date { display: block; margin-top: 3px; font-size: 12px; color: rgba(255,255,255,.88); }
  .countdown-chip {
    display: inline-block; margin-top: 10px; padding: 5px 16px;
    border-radius: 999px; background: rgba(255,255,255,.2);
    font-size: 12px; color: #fff;
  }
  .form-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--divider); }
  .form-row:last-child { border-bottom: none; }
  .form-label { width: 84px; flex-shrink: 0; font-size: 16px; color: var(--text); }
  .form-input { flex: 1; min-width: 0; height: 34px; font-size: 16px; color: var(--text); text-align: right; background: transparent; }
  input[type="date"].form-input { color: var(--text); }
  .stats-grid { display: flex; flex-wrap: wrap; }
  .mine-stat { width: 50%; text-align: center; padding: 12px 0; }
  .mine-stat .stat-value { color: var(--primary); font-size: 22px; }
  .mine-stat .stat-label { color: var(--text3); font-size: 13px; }
  .menu-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0; border-bottom: 1px solid var(--divider);
    font-size: 16px; cursor: pointer;
  }
  .menu-row:last-child { border-bottom: none; }
  .menu-row:active { opacity: .7; }
  .menu-row .arrow { color: var(--text4); }
  .menu-row.danger { color: var(--error); }
  .footer-tip { display: block; margin: 18px 0 8px; text-align: center; font-size: 13px; color: var(--text3); }

  /* ---------- TabBar ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    max-width: 560px; margin: 0 auto;
    background: rgba(249,249,249,.94);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 0 6px; color: #8E8E93; font-size: 10px;
    transition: color .15s ease, opacity .15s ease;
  }
  .tab:active { opacity: .6; }
  .tab svg { width: 24px; height: 24px; }
  .tab.active { color: var(--primary); font-weight: 500; }

  /* ---------- 弹窗 ---------- */
  .modal-mask {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(51,39,44,.45);
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-mask.show { display: flex; animation: fadeIn .2s ease; }
  .sheet {
    width: 100%; max-width: 560px;
    background: var(--card);
    border-radius: 16px 16px 0 0;
    padding: 12px 20px calc(28px + env(safe-area-inset-bottom));
    max-height: 80vh; overflow-y: auto;
    animation: slideUp .25s ease;
  }
  .sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--border); margin: 0 auto 12px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-title { font-size: 17px; font-weight: 600; }
  .sheet-close {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--input-bg); color: var(--text3);
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .f-label { display: block; font-size: 13px; color: var(--text2); font-weight: 500; margin: 14px 0 8px; }
  .f-label:first-of-type { margin-top: 0; }
  .f-input {
    width: 100%; height: 44px; padding: 0 14px;
    border-radius: 12px; background: var(--input-bg);
    font-size: 16px; color: var(--text);
  }
  .f-input::placeholder { color: var(--text4); }
  .form-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; min-width: 0; }
  .sheet .btn-primary { margin-top: 22px; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%);
    background: rgba(51,39,44,.88); color: #fff;
    font-size: 13px; padding: 9px 18px; border-radius: 999px;
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity .25s ease; max-width: 80vw; text-align: center;
  }
  #toast.show { opacity: 1; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- 手风琴（住宿酒店） ---------- */
  .hotel-head { cursor: pointer; }
  .hotel-chev { flex-shrink: 0; color: rgba(255,255,255,.9); font-size: 16px; line-height: 1; transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .hotel-chev.open { transform: rotate(-180deg); }
  .hotel-body { display: none; }
  .hotel-body.open { display: block; animation: fadeIn .25s ease; }

  /* ---------- 无障碍与交互细节 ---------- */
  /* 小图标按钮扩展点击热区至 ≥44px，不改变视觉布局 */
  .task-del, .task-edit, .exp-del, .exp-edit, .sheet-close { position: relative; }

/* ================= GitHub 云同步 ================= */
// 细粒度 Token：仅 wedding-checklist 仓库 Contents 读写（注意：内嵌于页面，仅供本应用同步使用；拆分拼接以避免明文扫描）
const GH_TOKEN = ['ghp', 'nvHmbpOa2NTwtGwVTOOrGAQltKiYcY1QzEQ1'].join('_');
const GH_REPO = 'Mrwang19960102/wedding-checklist';
const GH_FILE = 'data.json';

let state = null;
let fileSha = null;
let saveTimer = null;
// 数据结构版本号：每次调整默认清单结构后递增，旧版本本地缓存会被自动清理
const DATA_VERSION = 3;

function ghApi(method, body) {
  return fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE, {
    method: method,
    headers: {
      'Authorization': 'Bearer ' + GH_TOKEN,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
}
function encodeB64(s) { return btoa(unescape(encodeURIComponent(s))); }
function decodeB64(s) { return decodeURIComponent(escape(atob(s.replace(/\n/g, '')))); }
function setSync(text, level) {
  document.getElementById('sync-text').textContent = text;
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot' + (level ? ' ' + level : '');
}
function readLocal() {
  try {
    const raw = localStorage.getItem('wc_data');
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    console.error('[Local] 读取失败', e);
    return null;
  }
}
function writeLocal() {
  try {
    localStorage.setItem('wc_data', JSON.stringify(state));
    localStorage.setItem('wc_ver', String(DATA_VERSION));
  } catch (e) { console.error('[Local] 写入失败', e); }
}
async function loadData() {
  setSync(GH_TOKEN ? '同步中…' : '本地模式', GH_TOKEN ? 'warn' : '');
  let cloud = null;
  if (GH_TOKEN) {
    try {
      const r = await ghApi('GET');
      if (r.status === 200) {
        const d = await r.json();
        fileSha = d.sha;
        cloud = JSON.parse(decodeB64(d.content));
      } else if (r.status !== 404) {
        console.error('[Sync] GET 异常', r.status);
      }
    } catch (e) {
      console.error('[Sync] GET 失败', e);
    }
  }
  // 本地缓存版本过旧（如默认清单结构调整）时直接丢弃，使用最新数据
  const localVer = parseInt(localStorage.getItem('wc_ver') || '0', 10);
  let local = null;
  if (localVer >= DATA_VERSION) {
    local = readLocal();
  } else {
    localStorage.removeItem('wc_data');
    localStorage.removeItem('wc_pending');
    console.info('[Local] 数据版本升级，清理旧缓存', localVer, '->', DATA_VERSION);
  }
  const pending = localStorage.getItem('wc_pending') === '1';
  if (pending && local) {
    state = local;
    renderAll();
    cloudSave();
    return;
  }
  if (cloud && local) {
    // 双端都有数据：按 id 合并（互不丢失），再回传云端
    state = mergeState(cloud, local);
    writeLocal();
    renderAll();
    cloudSave();
    setSync('云端已同步', '');
    return;
  }
  if (cloud) { state = cloud; writeLocal(); }
  else if (local) { state = local; }
  else { state = JSON.parse(JSON.stringify(DEFAULT_DATA)); writeLocal(); }
  renderAll();
  if (GH_TOKEN) { setSync('云端已同步', ''); if (!cloud) cloudSave(); }
  else setSync('本地模式', '');
}
/* 云端与本地合并：列表按 id 取并集，同 id 以本地为准 */
function mergeTasks(base, extra) {
  const out = (base || []).slice();
  const map = {};
  out.forEach(x => { map[x.id] = x; });
  (extra || []).forEach(x => {
    if (map[x.id]) Object.assign(map[x.id], x);
    else out.push(x);
  });
  return out;
}
function mergeState(cloud, local) {
  const s = JSON.parse(JSON.stringify(cloud));
  s.profile = Object.assign({}, s.profile, local.profile);
  s.cert = Object.assign({}, s.cert, local.cert);
  ['decor', 'drinks', 'clothes', 'four'].forEach(k => {
    const a = s[k] || { tasks: [] };
    const b = local[k] || { tasks: [] };
    s[k] = { tasks: mergeTasks(a.tasks, b.tasks) };
  });
  (local.hotels || []).forEach(lh => {
    if (!s.hotels) s.hotels = [];
    const sh = s.hotels.find(h => h.id === lh.id);
    if (!sh) { s.hotels.push(JSON.parse(JSON.stringify(lh))); return; }
    const bookings = mergeTasks(sh.bookings || [], lh.bookings || []);
    const guests = mergeTasks(sh.guests || [], lh.guests || []);
    Object.assign(sh, JSON.parse(JSON.stringify(lh)), { bookings: bookings, guests: guests });
  });
  s.v = Math.max(s.v || 0, local.v || 0);
  s.t = Math.max(s.t || 0, local.t || 0);
  return s;
}
async function cloudSave(retry) {
  retry = retry || 0;
  if (!GH_TOKEN) return;
  setSync('同步中…', 'warn');
  const body = {
    message: 'update wedding data',
    content: encodeB64(JSON.stringify(state)),
    branch: 'main',
  };
  if (fileSha) body.sha = fileSha;
  try {
    const r = await ghApi('PUT', body);
    if (r.status === 200 || r.status === 201) {
      const d = await r.json();
      fileSha = d.content.sha;
      localStorage.removeItem('wc_pending');
      setSync('云端已同步', '');
    } else if (r.status === 409 && retry < 2) {
      const g = await ghApi('GET');
      if (g.status === 200) { fileSha = (await g.json()).sha; }
      cloudSave(retry + 1);
    } else {
      console.error('[Sync] PUT 失败', r.status);
      localStorage.setItem('wc_pending', '1');
      setSync('离线·本地暂存', 'err');
    }
  } catch (e) {
    console.error('[Sync] PUT 异常', e);
    localStorage.setItem('wc_pending', '1');
    setSync('离线·本地暂存', 'err');
  }
}
function mutate() {
  state.t = Date.now();
  writeLocal();
  renderAll();
  if (!GH_TOKEN) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(cloudSave, 600);
}

/* ================= 工具函数 ================= */
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}
function fmtDateCN(ds) {
  const p = ds.split('-');
  return p[0] + '年' + parseInt(p[1], 10) + '月' + parseInt(p[2], 10) + '日';
}
function daysUntil(ds) {
  const p = ds.split('-').map(Number);
  const target = new Date(p[0], p[1] - 1, p[2]);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / 86400000);
}
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ================= 渲染 ================= */
function renderAll() {
  if (!state.hotels) {
    // 旧缓存迁移：单酒店 -> 多酒店
    const main = state.hotel || buildDefaultHotel();
    if (!main.id) main.id = 'hotel_main';
    if (!main.tag) main.tag = '亲戚入住酒店';
    state.hotels = [main, buildPickupHotel()];
  }
  // 修复旧缓存中缺失的酒店信息 / 预定信息
  const defHotel = buildDefaultHotel();
  const mainHotel = state.hotels.find(h => h.id === 'hotel_main');
  if (mainHotel && !mainHotel.address) {
    mainHotel.address = defHotel.address;
    mainHotel.tag = mainHotel.tag || defHotel.tag;
    if (!mainHotel.highlights || !mainHotel.highlights.length) mainHotel.highlights = defHotel.highlights;
    if (!mainHotel.bookings || !mainHotel.bookings.length) mainHotel.bookings = defHotel.bookings;
  }
  if (!state.hotels.find(h => h.id === 'hotel_pickup')) state.hotels.push(buildPickupHotel());
  if (!state.hotels.find(h => h.id === 'hotel_huimen')) state.hotels.push(buildHuimenHotel());
  // v2 迁移：观嵩山酒店旧「入住名单」转为「预定信息」
  if (!state.v || state.v < 2) {
    const m = state.hotels.find(h => h.id === 'hotel_main');
    if (m) {
      const defIds = ['gst_1', 'gst_2', 'gst_3', 'gst_4'];
      const gs = m.guests || [];
      if (gs.length > 0 && gs.every(g => defIds.indexOf(g.id) !== -1)) {
        m.bookings = buildDefaultHotel().bookings;
        m.guests = [];
      }
    }
    state.v = 2;
  }
  // v4 迁移：接亲酒店补充婚房布置注意事项；清理婚宴酒席/客房默认预定
  if (!state.v || state.v < 4) {
    const pk = state.hotels.find(h => h.id === 'hotel_pickup');
    if (pk && (!pk.notes || !pk.notes.length)) pk.notes = buildPickupHotel().notes;
    const m4 = state.hotels.find(h => h.id === 'hotel_main');
    if (m4 && m4.bookings) m4.bookings = m4.bookings.filter(b => b.id !== 'bk_5' && b.id !== 'bk_6');
    state.v = 4;
  }
  // v6 迁移：补充酒店公开联系方式 / 坐标
  if (!state.v || state.v < 6) {
    const dm = buildDefaultHotel();
    const dp = buildPickupHotel();
    const hm = state.hotels.find(h => h.id === 'hotel_main');
    if (hm && !hm.phone) hm.phone = dm.phone;
    const hp = state.hotels.find(h => h.id === 'hotel_pickup');
    if (hp) {
      if (!hp.phone) hp.phone = dp.phone;
      if (!hp.lng) { hp.lng = dp.lng; hp.lat = dp.lat; }
    }
    state.v = 6;
  }
  // v8 迁移：预定改为入住/离店日期，晚数自动计算
  if (!state.v || state.v < 8) {
    (state.hotels || []).forEach(h => {
      (h.bookings || []).forEach(b => {
        if (!b.start && b.dates) {
          const m = String(b.dates).match(/^(\d{4})\.(\d{1,2})\.(\d{1,2})(?:\s*~\s*(?:(\d{4})\.)?(\d{1,2})\.(\d{1,2}))?$/);
          if (m) {
            b.start = m[1] + '-' + String(+m[2]).padStart(2, '0') + '-' + String(+m[3]).padStart(2, '0');
            if (m[5]) {
              b.end = (m[4] || m[1]) + '-' + String(+m[5]).padStart(2, '0') + '-' + String(+m[6]).padStart(2, '0');
            } else {
              const d = new Date(+m[1], +m[2] - 1, +m[3]);
              d.setDate(d.getDate() + (b.nights || 1));
              b.end = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }
            b.nights = Math.max(1, calcNights(b.start, b.end));
          }
        }
      });
    });
    state.v = 8;
  }
  state.hotels.forEach(h => {
    if (!('address' in h)) h.address = '';
    if (!('phone' in h)) h.phone = '';
    if (!('highlights' in h)) h.highlights = [];
    if (!h.notes) h.notes = [];
    if (!h.guests) h.guests = [];
    if (!h.bookings) h.bookings = [];
  });
  if (!state.drinks) state.drinks = { tasks: [] };
  if (!state.clothes) state.clothes = { tasks: [] };
  if (!state.four) state.four = { tasks: [] };
  if (!state.cert) state.cert = { date: '2026-09-19', place: '南京市金陵浪漫中心' };
  renderListSections();
  renderCert();
  renderHotel();
  renderMine();
}

/* ================= 住宿（多酒店） ================= */
function findHotel(id) {
  return (state.hotels || []).find(h => h.id === id);
}
let expandedHotelId = '';
function toggleHotel(id) {
  expandedHotelId = expandedHotelId === id ? '' : id;

let editBookingId = '';
let bookingHotelId = '';
function fmtMD(iso) { const p = iso.split('-'); return parseInt(p[1], 10) + '.' + parseInt(p[2], 10); }
function fmtRange(b) {
  if (!b.start) return b.dates || '待定';
  const p = b.start.split('-');
  const s = p[0] + '.' + fmtMD(b.start);
  if (!b.end) return s;
  const q = b.end.split('-');
  return s + '~' + (q[0] === p[0] ? fmtMD(b.end) : q[0] + '.' + fmtMD(b.end));
}
function calcNights(s, e) {
  return Math.round((new Date(e) - new Date(s)) / 86400000);
}
function updateNightsTip() {
  const tip = document.getElementById('nb-nights-tip');
  if (!tip) return;
  const s = document.getElementById('nb-start').value;
  const e = document.getElementById('nb-end').value;
  if (s && e) {
    const n = calcNights(s, e);
    tip.textContent = n >= 1 ? '自动计算：共 ' + n + ' 晚' : '离店日期需晚于入住日期';
  } else {
    tip.textContent = '选择入住/离店日期后自动计算晚数';
  }
}
function openAddBooking(hotelId) { openBookingForm(hotelId, null); }
function openEditBooking(hotelId, id) {

}
function openBookingForm(hotelId, b) {

  openModal(b ? '修改预定' : '添加预定',
    '<label class="f-label">姓名（可选）</label>' +
    '<input class="f-input" id="nb-name" maxlength="20" placeholder="入住人姓名" value="' + (b ? esc(b.name || '') : '') + '">' +
    '<label class="f-label">身份证号（可选）</label>' +
    '<input class="f-input" id="nb-idno" maxlength="18" placeholder="用于酒店登记" value="' + (b ? esc(b.idNo || '') : '') + '">' +
    '<label class="f-label">房型</label>' +
    '<input class="f-input" id="nb-room" maxlength="20" placeholder="例如：总统套房" value="' + (b ? esc(b.room) : '') + '">' +
    '<div class="row2">' +
      '<div><label class="f-label">入住日期</label><input class="f-input" id="nb-start" type="date" value="' + (b && b.start ? b.start : '') + '" onchange="updateNightsTip()"></div>' +
      '<div><label class="f-label">离店日期</label><input class="f-input" id="nb-end" type="date" value="' + (b && b.end ? b.end : '') + '" onchange="updateNightsTip()"></div>' +
    '</div>' +
    '<span class="card-tip" id="nb-nights-tip" style="display:block;margin-top:2px;"></span>' +
    '<div class="row2">' +
      '<div><label class="f-label">数量（间）</label><input class="f-input" id="nb-count" type="number" inputmode="numeric" min="1" value="' + (b ? b.count : 1) + '"></div>' +
      '<div><label class="f-label">备注</label><input class="f-input" id="nb-note" maxlength="30" placeholder="可选" value="' + (b ? esc(b.note) : '') + '"></div>' +
    '</div>' +
    '<button class="btn-primary" onclick="submitBooking()">' + (b ? '保存修改' : '确认添加') + '</button>');
  updateNightsTip();
}
function submitBooking() {
  const h = findHotel(bookingHotelId);
  if (!h) return;
  const room = document.getElementById('nb-room').value.trim();
  if (!room) { showToast('请输入房型'); return; }
  const start = document.getElementById('nb-start').value;
  const end = document.getElementById('nb-end').value;
  if (start && end && calcNights(start, end) < 1) { showToast('离店日期需晚于入住日期'); return; }
  const rec = {
    name: document.getElementById('nb-name').value.trim(),
    idNo: document.getElementById('nb-idno').value.trim(),
    room: room,
    start: start,
    end: end,
    nights: (start && end) ? Math.max(1, calcNights(start, end)) : 1,
    count: Math.max(1, parseInt(document.getElementById('nb-count').value, 10) || 1),
    note: document.getElementById('nb-note').value.trim(),
  };
  if (!h.bookings) h.bookings = [];
  if (editBookingId) {
    const b = h.bookings.find(x => x.id === editBookingId);
    if (b) Object.assign(b, rec);
    closeModal();
    mutate();
    showToast('已修改');
  } else {
    rec.id = 'bk_' + Date.now();
    h.bookings.push(rec);
    closeModal();
    mutate();
    showToast('已添加');
  }
}
function deleteBooking(hotelId, id) {
  askConfirm('确定要删除这条预定信息吗？', () => {
    const h = findHotel(hotelId);
    if (h) h.bookings = (h.bookings || []).filter(b => b.id !== id);
    mutate();
    showToast('已删除');
  });
}

        '<div class="hero-date">' + fmtDateCN(c.date) + ' 登记结婚</div>' +
      '</div>' +
      '<div class="countdown-badge">' +
        '<span class="countdown-num">' + (days >= 0 ? days : '囍') + '</span>' +
        '<span class="countdown-label">' + (days >= 0 ? '天后领证' : '已领证') + '</span>' +
      '</div>' +
    '</div>' +
  '</div>';
  html += '<div class="card"><div class="card-head"><span class="card-title">领证信息</span></div>' +
    '<div class="info-row"><span class="info-label">时间</span><span class="info-text">' + fmtDateCN(c.date) + '</span></div>' +
    '<div class="info-row" onclick="openCertMap()"><span class="info-label">地点</span><span class="info-text link">' + esc(c.place) + '（点击跳转高德地图）</span></div>' +
  '</div>';
  document.getElementById('cert-wrap').innerHTML = html;
}
function openCertMap() {
  const c = state.cert || { place: '南京市金陵浪漫中心' };
  window.location.href = 'https://uri.amap.com/search?keyword=' + encodeURIComponent(c.place) +
    '&city=' + encodeURIComponent('南京') + '&callnative=1&src=wedding_checklist';
}

/* ================= Tab 切换 ================= */
function switchTab(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  window.scrollTo(0, 0);
}

/* ================= 初始化 ================= */
document.getElementById('inp-groom').addEventListener('input', e => { state.profile.groomName = e.target.value; mutate(); });
document.getElementById('inp-bride').addEventListener('input', e => { state.profile.brideName = e.target.value; mutate(); });
document.getElementById('inp-date').addEventListener('change', e => {
  if (e.target.value) { state.profile.weddingDate = e.target.value; mutate(); }
});

loadData();
</script>
